<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety Ring — Sensor Response Demo</title>
<style>
  :root{
    --bg: #0F1115;
    --panel: #171A21;
    --panel-line: #262B35;
    --metal-dark: #3d4451;
    --metal-light: #a2a9b6;
    --text: #E8EAED;
    --muted: #8B93A1;
    --calm: #3FD0C9;
    --alert: #FF5A4E;
    --warn: #FFB648;
    --off: #3a3f4b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
    padding:32px 20px 60px;
  }
  .wrap{ max-width: 980px; margin: 0 auto; }
  header{ margin-bottom: 28px; }
  h1{
    font-size: 1.6rem;
    font-weight: 650;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .sub{ color: var(--muted); font-size: 0.95rem; max-width: 60ch; line-height:1.5; }

  .scenarios{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin: 22px 0 30px;
  }
  .scenario-btn{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--text);
    padding: 11px 16px;
    border-radius: 8px;
    font-size: 0.88rem;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    text-align:left;
    line-height:1.3;
  }
  .scenario-btn:hover{ border-color: var(--metal-light); }
  .scenario-btn.active{
    border-color: var(--calm);
    background: #14201f;
  }
  .scenario-btn.active[data-tone="alert"]{
    border-color: var(--alert);
    background: #241716;
  }
  .scenario-btn .name{ display:block; font-weight:600; margin-bottom:2px; }
  .scenario-btn .hint{ display:block; color: var(--muted); font-size: 0.78rem; }

  .stage{
    display:grid;
    grid-template-columns: 320px 1fr;
    gap: 28px;
    align-items:start;
  }
  @media (max-width: 720px){
    .stage{ grid-template-columns: 1fr; }
  }

  .ring-stage{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    padding: 28px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 14px;
  }
  .ring-status{
    font-size: 0.82rem;
    color: var(--muted);
    min-height: 1.4em;
    text-align:center;
  }
  .ring-status.alert-text{ color: var(--alert); font-weight:600; }
  .ring-status.warn-text{ color: var(--warn); font-weight:600; }

  .sensor-panel{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    padding: 22px;
  }
  .sensor-panel h2{
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0 0 16px;
  }
  .sensor-row{
    display:flex;
    align-items:flex-start;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--panel-line);
  }
  .sensor-row:last-child{ border-bottom:none; }
  .dot{
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--off);
    margin-top: 4px;
    flex-shrink:0;
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }
  .dot.on-calm{ background: var(--calm); box-shadow: 0 0 8px var(--calm); }
  .dot.on-alert{ background: var(--alert); box-shadow: 0 0 10px var(--alert); }
  .sensor-info .sname{ font-weight: 600; font-size: 0.9rem; }
  .sensor-info .sreading{ color: var(--muted); font-size: 0.8rem; margin-top: 2px; }

  .timeline{
    margin-top: 26px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    padding: 22px;
  }
  .timeline h2{ font-size: 0.95rem; font-weight:600; margin:0 0 18px; }
  .phases{ display:flex; gap: 8px; }
  .phase{
    flex:1;
    text-align:center;
    padding: 12px 6px;
    border-radius: 8px;
    background: #1d212a;
    border: 1px solid var(--panel-line);
    transition: all 0.2s ease;
  }
  .phase .plabel{ font-size: 0.72rem; color: var(--muted); margin-bottom:4px; }
  .phase .pname{ font-size: 0.82rem; font-weight:600; }
  .phase.done{ background: #182320; border-color: var(--calm); }
  .phase.done .pname{ color: var(--calm); }
  .phase.done-alert{ background: #241716; border-color: var(--alert); }
  .phase.done-alert .pname{ color: var(--alert); }
  .phase.done-warn{ background: #26200f; border-color: var(--warn); }
  .phase.done-warn .pname{ color: var(--warn); }

  /* Ring SVG states */
  #ringSvg .band{ transition: stroke 0.3s ease; }
  #ringSvg .node{ transition: fill 0.3s ease, opacity 0.3s ease; }
  #ringSvg .pulse{ opacity: 0; transition: opacity 0.3s ease; }
  #ringSvg .pulse.show{ opacity: 1; animation: pulseAnim 1.4s ease-in-out infinite; }
  @keyframes pulseAnim{
    0%{ transform: scale(1); opacity: 0.7; }
    70%{ transform: scale(2.2); opacity: 0; }
    100%{ transform: scale(2.2); opacity: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sensor response by scenario</h1>
    <div class="sub">Pick a situation below to see which sensors on the ring activate, and how far the escalation protocol runs.</div>
  </header>

  <div class="scenarios" id="scenarioButtons"></div>

  <div class="stage">
    <div class="ring-stage">
      <svg id="ringSvg" width="220" height="220" viewBox="0 0 220 220">
        <!-- finger -->
        <rect x="95" y="10" width="30" height="200" rx="15" fill="#2a2e37"/>
        <!-- ring band -->
        <ellipse class="band" cx="110" cy="110" rx="58" ry="58" fill="none" stroke="var(--off)" stroke-width="16"/>
        <!-- sensor nodes -->
        <circle class="node" id="nodeGSR" cx="110" cy="52" r="9" fill="var(--off)"/>
        <circle class="pulse" id="pulseGSR" cx="110" cy="52" r="9" fill="var(--alert)"/>

        <circle class="node" id="nodePPG" cx="163" cy="110" r="9" fill="var(--off)"/>
        <circle class="pulse" id="pulsePPG" cx="163" cy="110" r="9" fill="var(--alert)"/>

        <circle class="node" id="nodeACC" cx="110" cy="168" r="9" fill="var(--off)"/>
        <circle class="pulse" id="pulseACC" cx="110" cy="168" r="9" fill="var(--alert)"/>

        <circle class="node" id="nodeTAMPER" cx="57" cy="110" r="9" fill="var(--off)"/>
        <circle class="pulse" id="pulseTAMPER" cx="57" cy="110" r="9" fill="var(--warn)"/>
      </svg>
      <div class="ring-status" id="ringStatus">Select a scenario to see the ring respond.</div>
    </div>

    <div class="sensor-panel">
      <h2>Sensor readout</h2>
      <div id="sensorList"></div>
    </div>
  </div>

  <div class="timeline">
    <h2>Escalation protocol</h2>
    <div class="phases" id="phaseList">
      <div class="phase" data-phase="1"><div class="plabel">0s</div><div class="pname">Record + GPS lock</div></div>
      <div class="phase" data-phase="2"><div class="plabel">5s</div><div class="pname">Family alert</div></div>
      <div class="phase" data-phase="3"><div class="plabel">10s</div><div class="pname">Police dispatch (ERSS-112)</div></div>
    </div>
  </div>
</div>

<script>
const scenarios = [
  {
    id: 'idle',
    name: 'Walking home, no threat',
    hint: 'Baseline monitoring',
    tone: 'calm',
    ringStatus: 'All readings within normal range. Ring stays silent.',
    sensors: {
      GSR: { state: 'calm', reading: 'Stable — no sweat spike' },
      PPG: { state: 'calm', reading: '78 bpm, smooth rhythm' },
      ACC: { state: 'calm', reading: 'Rhythmic gait pattern' },
      TAMPER: { state: 'off', reading: 'Loop intact' }
    },
    phasesReached: 0
  },
  {
    id: 'manual',
    name: 'Notices someone following',
    hint: 'Manual tap trigger',
    tone: 'warn',
    ringStatus: 'User taps the pattern. Trigger is manual — biometrics stay calm.',
    sensors: {
      GSR: { state: 'calm', reading: 'Elevated but not spiking' },
      PPG: { state: 'calm', reading: '95 bpm — anxious, not distressed' },
      ACC: { state: 'calm', reading: 'Normal walking pace' },
      TAMPER: { state: 'off', reading: 'Loop intact' }
    },
    manualTap: true,
    phasesReached: 3
  },
  {
    id: 'ambush',
    name: 'Sudden physical assault',
    hint: 'AI passive detection — sensor fusion',
    tone: 'alert',
    ringStatus: 'Three signals spike together. AI fires the alert with no button press.',
    sensors: {
      GSR: { state: 'alert', reading: 'Sharp spike — sudden fear' },
      PPG: { state: 'alert', reading: '162 bpm, abnormal acceleration' },
      ACC: { state: 'alert', reading: 'Chaotic, jerky motion' },
      TAMPER: { state: 'off', reading: 'Loop intact' }
    },
    phasesReached: 3
  },
  {
    id: 'tamper',
    name: 'Attacker rips off the ring',
    hint: 'Tamper detection — dead man\u2019s switch',
    tone: 'alert',
    ringStatus: 'Circuit loop breaks. Ring jumps straight to maximum alert.',
    sensors: {
      GSR: { state: 'alert', reading: 'Spiking before disconnect' },
      PPG: { state: 'alert', reading: 'Spiking before disconnect' },
      ACC: { state: 'alert', reading: 'Violent motion before disconnect' },
      TAMPER: { state: 'alert', reading: 'Loop broken — device destroyed' }
    },
    ringStatus2: true,
    phasesReached: 3
  }
];

const sensorMeta = {
  GSR: { label: 'GSR — skin sweat response', node: 'nodeGSR', pulse: 'pulseGSR' },
  PPG: { label: 'PPG — heart rate', node: 'nodePPG', pulse: 'pulsePPG' },
  ACC: { label: 'Accelerometer — motion', node: 'nodeACC', pulse: 'pulseACC' },
  TAMPER: { label: 'Tamper loop — ring integrity', node: 'nodeTAMPER', pulse: 'pulseTAMPER' }
};

const btnWrap = document.getElementById('scenarioButtons');
const sensorList = document.getElementById('sensorList');
const ringStatus = document.getElementById('ringStatus');
const band = document.querySelector('#ringSvg .band');
const phaseEls = document.querySelectorAll('.phase');

function render(scenario){
  // buttons
  document.querySelectorAll('.scenario-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.id === scenario.id);
  });

  // ring band + status tone
  ringStatus.className = 'ring-status';
  if(scenario.tone === 'alert'){
    band.setAttribute('stroke', 'var(--alert)');
    ringStatus.classList.add('alert-text');
  } else if(scenario.tone === 'warn'){
    band.setAttribute('stroke', 'var(--warn)');
    ringStatus.classList.add('warn-text');
  } else {
    band.setAttribute('stroke', 'var(--calm)');
  }
  ringStatus.textContent = scenario.ringStatus;

  // sensor nodes on ring + list
  sensorList.innerHTML = '';
  Object.entries(scenario.sensors).forEach(([key, val])=>{
    const meta = sensorMeta[key];
    const nodeEl = document.getElementById(meta.node);
    const pulseEl = document.getElementById(meta.pulse);

    let color = 'var(--off)';
    let dotClass = '';
    if(val.state === 'calm'){ color = 'var(--calm)'; dotClass = 'on-calm'; }
    if(val.state === 'alert'){ color = key === 'TAMPER' ? 'var(--warn)' : 'var(--alert)'; dotClass = 'on-alert'; }

    nodeEl.setAttribute('fill', color);
    pulseEl.classList.toggle('show', val.state === 'alert');

    const row = document.createElement('div');
    row.className = 'sensor-row';
    row.innerHTML = `
      <div class="dot ${dotClass}"></div>
      <div class="sensor-info">
        <div class="sname">${meta.label}</div>
        <div class="sreading">${val.reading}</div>
      </div>`;
    sensorList.appendChild(row);
  });

  // timeline
  phaseEls.forEach(el=>{
    const p = parseInt(el.dataset.phase, 10);
    el.classList.remove('done','done-alert','done-warn');
    if(p <= scenario.phasesReached){
      if(scenario.tone === 'alert') el.classList.add('done-alert');
      else if(scenario.tone === 'warn') el.classList.add('done-warn');
      else el.classList.add('done');
    }
  });
}

scenarios.forEach((s, i)=>{
  const btn = document.createElement('button');
  btn.className = 'scenario-btn';
  btn.dataset.id = s.id;
  btn.dataset.tone = s.tone;
  btn.innerHTML = `<span class="name">${s.name}</span><span class="hint">${s.hint}</span>`;
  btn.addEventListener('click', ()=>render(s));
  btnWrap.appendChild(btn);
  if(i === 0) render(s);
});
</script>
</body>
</html>
